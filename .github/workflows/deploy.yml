name: Deploy Masterjee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check deploy secrets
        id: deploy-secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          missing=0

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::warning::SSH_PRIVATE_KEY secret is not set; skipping deployment."
            missing=1
          fi

          if [ -z "$SSH_HOST" ]; then
            echo "::warning::SSH_HOST secret is not set; skipping deployment."
            missing=1
          fi

          if [ -z "$SSH_USER" ]; then
            echo "::warning::SSH_USER secret is not set; skipping deployment."
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        if: steps.deploy-secrets.outputs.configured == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Create release directory
        if: steps.deploy-secrets.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p /home/diabkloz/masterjee_app/releases/${{ github.sha }}"

      - name: Upload project
        if: steps.deploy-secrets.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='config/config.php' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./ \
            "$SSH_USER@$SSH_HOST:/home/diabkloz/masterjee_app/releases/${{ github.sha }}/"

      - name: Activate release
        if: steps.deploy-secrets.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "${{ github.sha }}" <<'REMOTE_SCRIPT'

          set -e

          RELEASE_SHA="$1"
          APP_ROOT="/home/diabkloz/masterjee_app"
          WEB_ROOT="/home/diabkloz/masterjee.guru"
          RELEASE="$APP_ROOT/releases/$RELEASE_SHA"

          echo "Activating release: $RELEASE"

          test -d "$RELEASE"
          test -d "$RELEASE/config"
          test -f "$APP_ROOT/shared/config.php"

          rm -f "$RELEASE/config/config.php"
          ln -s "$APP_ROOT/shared/config.php" "$RELEASE/config/config.php"

          find "$WEB_ROOT" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".well-known" \
            -exec rm -rf {} +

          cp -a "$RELEASE"/. "$WEB_ROOT"/

          rm -f "$WEB_ROOT/config/config.php"
          ln -s "$APP_ROOT/shared/config.php" "$WEB_ROOT/config/config.php"

          ln -sfn "$RELEASE" "$APP_ROOT/current"

          chmod -R u+rwX,go+rX "$WEB_ROOT"

          cd "$APP_ROOT/releases"
          ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf

          echo "Masterjee deployment complete"
          REMOTE_SCRIPT
